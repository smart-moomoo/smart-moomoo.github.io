<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f7f3">
  <meta name="description" content="A relaxing little farm game on Hao Ren's website — grow plants and raise animals.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Farm · Hao Ren">
  <meta property="og:description" content="Grow plants, raise animals, and watch your farm grow — even while you're away.">
  <meta property="og:url" content="https://smart-moomoo.github.io/farm.html">
  <title>Farm · Hao Ren</title>
  <link rel="canonical" href="https://smart-moomoo.github.io/farm.html">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./farm.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="page">
    <header class="site-header">
      <a class="wordmark" href="./index.html" aria-label="Hao Ren, home">Hao Ren</a>
      <nav aria-label="Main navigation">
        <a href="./index.html#about">About</a>
        <a href="./index.html#publications">Publications</a>
        <a href="./index.html#open-source">Open source</a>
        <a href="./index.html#experience">Experience</a>
        <a href="./index.html#education">Education</a>
        <a href="./index.html#guestbook">Messages</a>
        <a href="./game.html">Game</a>
        <a href="./farm.html" aria-current="location">Farm</a>
      </nav>
    </header>

    <main id="main">
      <section class="hero farm-hero" aria-label="Cozy Farm game">
        <div class="farm-topbar">
          <div class="farm-stat"><span aria-hidden="true">🪙</span><strong id="farm-coins">0</strong></div>
          <div class="farm-stat farm-stat-muted"><span aria-hidden="true">🌾</span><span id="farm-harvest-count">0</span> collected</div>
          <button type="button" class="farm-reset" id="farm-reset">Reset farm</button>
        </div>

        <div class="farm-board">
          <div class="farm-panel">
            <h2 class="farm-panel-title">Garden</h2>
            <div class="farm-grid" id="garden-grid" role="list"></div>
          </div>
          <div class="farm-panel">
            <h2 class="farm-panel-title">Pen</h2>
            <div class="farm-grid farm-grid-pen" id="pen-grid" role="list"></div>
          </div>
        </div>

        <div class="farm-tray" id="farm-tray" hidden>
          <div class="farm-tray-header">
            <span id="farm-tray-title">Choose</span>
            <button type="button" class="farm-tray-close" id="farm-tray-close" aria-label="Close">✕</button>
          </div>
          <div class="farm-tray-options" id="farm-tray-options"></div>
        </div>
      </section>
    </main>
    <footer><span>© <span id="year">2026</span> Hao Ren</span><a href="https://www.linkedin.com/in/hao-ren-b7b216244/">LinkedIn ↗</a><a href="./index.html#about">Back to profile <span aria-hidden="true">↑</span></a></footer>
  </div>
  <script src="./script.js" defer></script>
  <script src="./farm.js" defer></script>
</body>
</html>
